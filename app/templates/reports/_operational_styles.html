<style>
.opr{width:100%;max-width:1600px;margin:0 auto;font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:#203329;box-sizing:border-box}.opr *{box-sizing:border-box}
.opr-head{display:flex;justify-content:space-between;align-items:flex-start;gap:16px;padding:20px 22px;background:#fff;border:1px solid #dfeae2;border-radius:20px;box-shadow:0 12px 32px rgba(31,80,49,.055)}.opr-head h1{margin:0;font-size:clamp(1.55rem,2.35vw,2.15rem);letter-spacing:-.025em;color:#17251d}.opr-head p{margin:5px 0 0;color:#748279;font-size:.84rem;line-height:1.4}.opr-scope{margin-top:8px;display:inline-flex;align-items:center;gap:7px;color:#397e51;font-size:.76rem;font-weight:850}.opr-scope:before{content:"";width:7px;height:7px;border-radius:50%;background:#4b9a64}
.opr-actions{display:flex;gap:8px;flex-wrap:wrap}.opr-btn{appearance:none;display:inline-flex;align-items:center;justify-content:center;gap:7px;min-height:38px;padding:8px 12px;border:1px solid #d8e6dc;border-radius:10px;background:#fff;color:#2f6e46;text-decoration:none;font:inherit;font-size:.73rem;font-weight:850;cursor:pointer;white-space:nowrap;transition:.18s ease}.opr-btn:hover{border-color:#9bc8a8;background:#f5faf6;transform:translateY(-1px)}.opr-btn.primary{background:#397e51;border-color:#397e51;color:#fff}.opr-btn.primary:hover{background:#2e6f46}.opr-btn svg{width:15px;height:15px}
.opr-tabs{display:flex;gap:7px;overflow-x:auto;padding:12px 1px 4px;margin:3px 0 11px;scrollbar-width:thin}.opr-tabs a{flex:0 0 auto;padding:8px 12px;border:1px solid #dfe9e2;border-radius:10px;background:#fff;color:#607168;text-decoration:none;font-size:.72rem;font-weight:850;transition:.16s ease}.opr-tabs a:hover{border-color:#acd0b7;color:#2f6e46}.opr-tabs a.active{background:#edf8f0;border-color:#8dc39d;color:#276d43;box-shadow:0 3px 12px rgba(57,126,81,.08)}

.opr-kpis{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:10px;margin:0 0 14px}.opr-kpi{min-width:0;background:#fff;border:1px solid #dfe9e2;border-radius:14px;padding:14px 15px;box-shadow:0 7px 21px rgba(27,74,44,.04);animation:oprRise .28s ease both}.opr-kpi.warning{border-color:#f0d7a2;background:#fffdf8}.opr-kpi.good{border-color:#bfe0c8;background:#fbfefc}.opr-kpi small{display:block;color:#748279;font-size:.65rem;font-weight:850;line-height:1.25;margin-bottom:6px}.opr-kpi strong{display:block;color:#1d3828;font-size:clamp(1.05rem,1.45vw,1.42rem);line-height:1.12;overflow-wrap:anywhere}.opr-kpi.warning strong{color:#875b0b}.opr-kpi .note{margin-top:5px;color:#86938c;font-size:.62rem;line-height:1.3}@keyframes oprRise{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.opr-note{display:flex;align-items:flex-start;gap:8px;margin:0 0 14px;padding:9px 11px;border:1px solid #dfe9e2;border-radius:10px;background:#f8fbf9;color:#66766e;font-size:.69rem;line-height:1.4}.opr-note b{color:#397e51}.opr-note-icon{flex:0 0 17px;width:17px;height:17px;border-radius:50%;display:flex;align-items:center;justify-content:center;background:#e5f4e9;color:#2f7a4b;font-size:.63rem;font-weight:950}
.opr-grid{display:grid;grid-template-columns:minmax(0,1fr);gap:14px}.opr-card{background:#fff;border:1px solid #e0eae3;border-radius:17px;box-shadow:0 8px 24px rgba(31,79,49,.04);overflow:hidden}.opr-card-head{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:14px 16px;border-bottom:1px solid #edf2ee}.opr-card-head h2{margin:0;color:#263a2e;font-size:.92rem}.opr-card-head .count{color:#87938c;font-size:.65rem;font-weight:800}.opr-empty{padding:34px 16px;text-align:center;color:#8a968f;font-size:.76rem}
.opr-chart-wrap{padding:16px 16px 13px}.opr-chart{height:230px;display:flex;align-items:flex-end;gap:9px;border-bottom:1px solid #e7eee9;padding:12px 3px 0;overflow-x:auto}.opr-bar-wrap{height:100%;min-width:58px;flex:1;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;gap:6px}.opr-bar-value{font-size:.6rem;font-weight:850;color:#496056;white-space:nowrap}.opr-bar{width:min(38px,68%);min-height:7px;border-radius:8px 8px 2px 2px;background:linear-gradient(180deg,#69aa7d,#397e51);transform-origin:bottom;animation:oprGrow .45s ease both}.opr-bar-label{height:26px;color:#75847c;font-size:.59rem;text-align:center;line-height:1.15;white-space:nowrap}@keyframes oprGrow{from{transform:scaleY(.08);opacity:.4}to{transform:scaleY(1);opacity:1}}
.opr-table-wrap{width:100%;overflow:auto}.opr-table{width:100%;min-width:780px;border-collapse:collapse}.opr-table th{position:sticky;top:0;z-index:1;padding:10px 11px;background:#f7faf8;color:#697970;text-align:left;font-size:.61rem;text-transform:uppercase;letter-spacing:.3px;font-weight:900;border-bottom:1px solid #e4ebe6;white-space:nowrap}.opr-table td{padding:10px 11px;border-bottom:1px solid #eef3ef;color:#34473d;font-size:.7rem;line-height:1.35;vertical-align:top}.opr-table tbody tr:hover{background:#fbfdfb}.opr-table tbody tr:last-child td{border-bottom:0}.opr-money{font-weight:850;color:#263f31;white-space:nowrap}.opr-status{display:inline-flex;padding:4px 7px;border-radius:999px;background:#f1f5f2;color:#607168;font-size:.6rem;font-weight:900;white-space:nowrap}.opr-status[data-status*="paid"],.opr-status[data-status="completed"],.opr-status[data-status="received"],.opr-status[data-status="delivered"],.opr-status[data-status="live"]{background:#eaf8ee;color:#2c7546}.opr-status[data-status*="awaiting"],.opr-status[data-status*="partial"],.opr-status[data-status="requested"],.opr-status[data-status="approved"],.opr-status[data-status="dispatched"]{background:#fff6df;color:#8a620e}.opr-status[data-status="cancelled"],.opr-status[data-status="rejected"]{background:#feecec;color:#a13a3a}.opr-pager{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:10px 12px;border-top:1px solid #edf2ee;color:#7a8880;font-size:.65rem}.opr-pager-actions{display:flex;gap:5px}.opr-page-btn{height:30px;min-width:64px;border:1px solid #dce7df;border-radius:8px;background:#fff;color:#397e51;font:inherit;font-size:.65rem;font-weight:850;cursor:pointer}.opr-page-btn:disabled{opacity:.4;cursor:default}
