<style>
.s10-shell{max-width:1600px;margin:0 auto;font-family:Inter,"Segoe UI",Arial,sans-serif;color:#173127}
.s10-hero{display:flex;justify-content:space-between;gap:18px;align-items:flex-start;padding:24px;border:1px solid #dbe9df;border-radius:24px;background:linear-gradient(135deg,#f5fbf7,#eef8f1);box-shadow:0 12px 35px rgba(29,78,45,.07);margin-bottom:18px}
.s10-hero h1{margin:0 0 6px;font-size:clamp(1.55rem,2.2vw,2.3rem);color:#173127}.s10-hero p{margin:0;color:#607168;max-width:900px;line-height:1.55}
.s10-badge{display:inline-flex;align-items:center;gap:7px;padding:8px 12px;border-radius:999px;background:#dcfce7;color:#166534;font-size:.78rem;font-weight:850;white-space:nowrap}
.s10-tabs{display:flex;gap:8px;flex-wrap:wrap;margin:0 0 18px}.s10-tabs a{padding:9px 13px;border:1px solid #d8e7dc;background:#fff;border-radius:12px;color:#476057;text-decoration:none;font-weight:800;font-size:.88rem}.s10-tabs a:hover,.s10-tabs a.active{background:#1f6f43;color:#fff;border-color:#1f6f43}
.s10-filters{display:grid;grid-template-columns:1.4fr repeat(3,minmax(140px,.7fr)) auto;gap:10px;align-items:end;background:#fff;border:1px solid #e1ebe4;padding:14px;border-radius:18px;margin-bottom:18px}.s10-filters label{display:block;font-size:.72rem;font-weight:850;color:#6b7d74;margin:0 0 5px;text-transform:uppercase;letter-spacing:.35px}.s10-filters input,.s10-filters select{width:100%;border:1px solid #d8e5dc;border-radius:11px;padding:10px 11px;background:#fff;color:#253d33}.s10-btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;border:0;border-radius:11px;padding:10px 14px;background:#1f6f43;color:#fff!important;text-decoration:none;font-weight:850;cursor:pointer;white-space:nowrap}.s10-btn.secondary{background:#edf6f0;color:#225d3b!important;border:1px solid #d8e7dc}.s10-btn.warn{background:#fff7ed;color:#9a3412!important;border:1px solid #fed7aa}
.s10-grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px;margin-bottom:18px}.s10-card{background:#fff;border:1px solid #e0ebe3;border-radius:18px;padding:17px;box-shadow:0 9px 26px rgba(31,111,67,.05)}.s10-card small{display:block;color:#74847c;font-size:.77rem;font-weight:850;text-transform:uppercase;letter-spacing:.36px;margin-bottom:8px}.s10-card strong{display:block;font-size:1.55rem;line-height:1.15;color:#183b2a}.s10-card .sub{margin-top:7px;color:#78877f;font-size:.82rem}
.s10-section{background:#fff;border:1px solid #e0ebe3;border-radius:20px;margin:0 0 18px;box-shadow:0 8px 24px rgba(31,111,67,.04);overflow:hidden}.s10-section-head{display:flex;justify-content:space-between;gap:12px;align-items:center;padding:16px 18px;border-bottom:1px solid #edf2ee}.s10-section-head h2{margin:0;font-size:1.12rem;color:#1d3f2e}.s10-section-head p{margin:3px 0 0;color:#7b8982;font-size:.84rem}.s10-table{width:100%;border-collapse:collapse;min-width:900px}.s10-table th{background:#f7faf8;color:#5b6e64;font-size:.74rem;text-transform:uppercase;letter-spacing:.35px;text-align:left;padding:11px 12px;border-bottom:1px solid #e7eee9}.s10-table td{padding:12px;border-bottom:1px solid #eef3ef;color:#31483d;font-size:.87rem;vertical-align:top}.s10-table tr:last-child td{border-bottom:0}.s10-table-wrap{overflow:auto}.s10-empty{padding:35px;text-align:center;color:#7d8e85}
.s10-pill{display:inline-flex;padding:5px 9px;border-radius:999px;font-size:.75rem;font-weight:850;background:#edf4ef;color:#466156}.s10-pill.good{background:#dcfce7;color:#166534}.s10-pill.bad{background:#fee2e2;color:#991b1b}.s10-pill.warn{background:#fef3c7;color:#92400e}.s10-pill.info{background:#e0f2fe;color:#075985}
.s10-chain{display:flex;flex-wrap:wrap;gap:6px}.s10-chain span{padding:5px 8px;border-radius:8px;background:#f2f7f3;border:1px solid #e3ece6;font-size:.76rem;color:#4d6257}.s10-issue{display:grid;grid-template-columns:110px minmax(150px,.7fr) minmax(180px,.8fr) 1.5fr;gap:10px;padding:13px 16px;border-bottom:1px solid #edf2ee;align-items:start}.s10-issue:last-child{border-bottom:0}.s10-health{display:grid;grid-template-columns:42px 1fr auto;gap:12px;align-items:center;padding:14px 16px;border-bottom:1px solid #edf2ee}.s10-health:last-child{border-bottom:0}.s10-health-icon{width:36px;height:36px;border-radius:12px;display:flex;align-items:center;justify-content:center;background:#dcfce7;color:#166534;font-weight:900}.s10-health.attn .s10-health-icon{background:#fee2e2;color:#991b1b}.s10-progress{height:10px;background:#e8f0eb;border-radius:999px;overflow:hidden}.s10-progress>span{display:block;height:100%;background:#2f855a;border-radius:999px}.s10-uat{display:grid;grid-template-columns:52px 1fr 150px;gap:14px;align-items:start;padding:15px 17px;border-bottom:1px solid #edf2ee}.s10-uat:last-child{border-bottom:0}.s10-uat-num{width:42px;height:42px;border-radius:13px;background:#e8f5ec;color:#1f6f43;display:flex;align-items:center;justify-content:center;font-weight:900}.s10-uat h3{margin:2px 0 5px;font-size:1rem}.s10-uat p{margin:0;color:#66786f;font-size:.87rem;line-height:1.5}.s10-print-note{font-size:.78rem;color:#7d8a84}
@media(max-width:1150px){.s10-grid{grid-template-columns:repeat(2,minmax(0,1fr))}.s10-filters{grid-template-columns:1fr 1fr 1fr}.s10-filters .wide{grid-column:1/-1}}
@media(max-width:720px){.s10-hero{flex-direction:column}.s10-grid{grid-template-columns:1fr}.s10-filters{grid-template-columns:1fr}.s10-filters .wide{grid-column:auto}.s10-issue{grid-template-columns:1fr}.s10-uat{grid-template-columns:48px 1fr}.s10-uat .uat-state{grid-column:2}.s10-card strong{font-size:1.35rem}}
@media print{.sidebar,.top-header,.footer,.mobile-overlay,.s10-tabs,.s10-filters,.s10-no-print{display:none!important}.main{margin:0!important;width:100%!important;max-width:none!important;padding:12px!important}.s10-shell{max-width:none}.s10-section,.s10-card,.s10-hero{box-shadow:none;break-inside:avoid}}
</style>
