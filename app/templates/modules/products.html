{% extends 'base.html' %}
{% block content %}

<style>
    .page-card{
        width:100%;
        border:1px solid rgba(220,238,226,.95);
        border-radius:26px;
        padding:28px;
        background:rgba(255,255,255,.92);
        box-shadow:0 22px 55px rgba(23,37,42,.10);
        backdrop-filter:blur(14px);
        font-family:"Times New Roman", Georgia, serif;
        overflow:hidden;
    }

    .title-row{
        display:flex;
        align-items:center;
        justify-content:space-between;
        gap:20px;
        margin-bottom:24px;
        flex-wrap:wrap;
    }

    .title-left{
        display:flex;
        align-items:center;
        gap:12px;
        min-width:0;
    }

    .title-left h2{
        margin:0;
        color:#17252A;
        font-size:clamp(1.45rem, 2.1vw, 1.9rem);
        font-weight:700;
        line-height:1.25;
        white-space:nowrap;
    }

    .back-btn{
        display:none;
        width:42px;
        height:42px;
        border:none;
        border-radius:14px;
        align-items:center;
        justify-content:center;
        background:rgba(228,247,234,.82);
        color:#3B7D55;
        font-size:1.65rem;
        font-weight:700;
        cursor:pointer;
        box-shadow:0 8px 20px rgba(95,168,120,.12);
        transition:all .2s ease;
        flex:0 0 auto;
    }

    .back-btn:hover{
        background:#5FA878;
        color:#fff;
        transform:translateX(-2px);
    }

    .product-list{
        display:grid;
        gap:16px;
        width:100%;
    }

    .product-item{
        display:grid;
        grid-template-columns:1fr 132px;
        gap:18px;
        align-items:center;
        padding:18px;
        border:1px solid rgba(220,238,226,.95);
        border-radius:22px;
        background:#fff;
        box-shadow:0 12px 28px rgba(23,37,42,.06);
        transition:all .22s ease;
    }

    .product-item:hover{
        transform:translateY(-2px);
        box-shadow:0 18px 40px rgba(23,37,42,.10);
        border-color:rgba(95,168,120,.38);
    }

    .product-info{
        min-width:0;
    }

    .product-name{
        margin:0 0 8px;
        color:#17252A;
        font-size:1.22rem;
        font-weight:800;
        line-height:1.25;
        word-break:break-word;
    }

    .product-subline{
        display:flex;
        align-items:center;
        gap:8px;
        flex-wrap:wrap;
        margin-bottom:10px;
    }

    .product-pill{
        display:inline-flex;
        align-items:center;
        min-height:28px;
        padding:5px 10px;
        border-radius:999px;
        background:rgba(228,247,234,.75);
        color:#3B7D55;
        border:1px solid rgba(95,168,120,.22);
        font-size:.9rem;
        font-weight:700;
    }

    .product-centres{
        color:#64748B;
        font-size:.98rem;
        line-height:1.4;
        word-break:break-word;
    }

    .product-centres strong{
        color:#425466;
        font-weight:800;
    }

    .product-side{
        display:flex;
        flex-direction:column;
        align-items:center;
        gap:10px;
    }

    .product-image{
        width:118px;
        height:94px;
        border-radius:18px;
        border:1px solid rgba(95,168,120,.18);
        background:linear-gradient(180deg, #EAF7EE, #FFFFFF);
        display:flex;
        align-items:center;
        justify-content:center;
        color:#3B7D55;
        box-shadow:0 10px 22px rgba(95,168,120,.12);
    }

    .product-image svg{
        width:42px;
        height:42px;
    }

    .product-price{
        color:#17252A;
        font-size:1.08rem;
        font-weight:900;
        line-height:1;
    }

    .empty-state{
        width:100%;
        padding:34px 20px;
        border:1px solid rgba(220,238,226,.95);
        border-radius:22px;
        background:rgba(255,255,255,.82);
        color:#64748B;
        text-align:center;
        font-size:1.05rem;
        font-weight:700;
        box-shadow:0 12px 28px rgba(23,37,42,.05);
    }

    @media (max-width:860px){
        .back-btn{
            display:inline-flex;
        }

        .page-card{
            padding:22px;
            border-radius:22px;
        }

        .title-row{
            flex-direction:column;
            align-items:stretch;
        }

        .product-item{
            grid-template-columns:1fr 112px;
            gap:14px;
            padding:15px;
            border-radius:20px;
        }

        .product-image{
            width:104px;
            height:86px;
            border-radius:16px;
        }

        .product-image svg{
            width:38px;
            height:38px;
        }

        .product-name{
            font-size:1.12rem;
        }
    }

    @media (max-width:560px){
        .page-card{
            padding:16px;
            border-radius:18px;
        }

        .title-left h2{
            font-size:1.45rem;
        }

        .product-item{
            grid-template-columns:1fr 96px;
            gap:12px;
            padding:14px;
        }

        .product-image{
            width:92px;
            height:78px;
            border-radius:15px;
        }

        .product-image svg{
            width:34px;
            height:34px;
        }

        .product-name{
            font-size:1.06rem;
            margin-bottom:7px;
        }

        .product-centres{
            font-size:.92rem;
        }

        .product-price{
            font-size:1rem;
        }

        .product-pill{
            font-size:.84rem;
            padding:5px 9px;
        }
    }

    @media (max-width:420px){
        .back-btn{
            width:38px;
            height:38px;
            border-radius:12px;
            font-size:1.45rem;
        }

        .product-item{
            grid-template-columns:1fr 86px;
        }

        .product-image{
            width:82px;
            height:72px;
        }
    }
</style>

<div class="page-card">
    <div class="title-row">
        <div class="title-left">
            <button type="button" class="back-btn" onclick="history.back()" aria-label="Back">←</button>
            <h2>Products Module</h2>
        </div>
    </div>

    {% if items %}
        <div class="product-list">
            {% for i in items %}
                <article class="product-item">
                    <div class="product-info">
                        <h3 class="product-name">{{ i.name }}</h3>

                        <div class="product-subline">
                            <span class="product-pill">{{ i.category }}</span>
                            <span class="product-pill">{{ i.type }}</span>
                        </div>

                        <div class="product-centres">
                            <strong>Available Centres:</strong> {{ i.available_centres }}
                        </div>
                    </div>

                    <div class="product-side">
                        <div class="product-image" aria-hidden="true">
                            <svg viewBox="0 0 24 24" fill="none">
                                <path d="M4 7.5L12 3l8 4.5v9L12 21l-8-4.5v-9Z" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/>
                                <path d="M4.5 8L12 12.2 19.5 8M12 21v-8.8" stroke="currentColor" stroke-width="1.8"/>
                            </svg>
                        </div>
                        <div class="product-price">₹{{ i.price }}</div>
                    </div>
                </article>
            {% endfor %}
        </div>
    {% else %}
        <div class="empty-state">
            No products found.
        </div>
    {% endif %}
</div>

{% endblock %}
