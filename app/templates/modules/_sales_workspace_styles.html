<style>
.sales-workspace{width:100%;display:grid;gap:14px;font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:#1f3127}
.sw-card{background:#fff;border:1px solid #dbe9df;border-radius:18px;box-shadow:0 10px 28px rgba(26,72,43,.05)}
.sw-head{padding:20px 22px;display:flex;align-items:flex-start;justify-content:space-between;gap:16px;flex-wrap:wrap}
.sw-head h1,.sw-head h2{margin:0;color:#17251d;font-size:1.55rem;line-height:1.2;font-weight:850;letter-spacing:-.02em}.sw-head p{margin:5px 0 0;color:#68786f;font-size:.88rem;line-height:1.45}
.sw-actions{display:flex;gap:8px;flex-wrap:wrap}.sw-btn{min-height:38px;padding:8px 13px;border:1px solid #c8ddce;border-radius:9px;background:#fff;color:#286b42;font:inherit;font-size:.84rem;font-weight:750;text-decoration:none;display:inline-flex;align-items:center;justify-content:center;cursor:pointer}.sw-btn:hover{background:#f4faf6;border-color:#9fc8ab}.sw-btn.primary{background:#397e51;border-color:#397e51;color:#fff}.sw-btn.primary:hover{background:#2f6e46}.sw-btn.danger{color:#a63d34;border-color:#efc6c1}
.sw-kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}.sw-kpi{padding:14px 15px;background:#fff;border:1px solid #dbe9df;border-radius:14px}.sw-kpi span{display:block;color:#6e7e75;font-size:.72rem;font-weight:800;letter-spacing:.02em;margin-bottom:5px}.sw-kpi strong{display:block;color:#1f3127;font-size:1.22rem;line-height:1.15;font-weight:850}.sw-kpi small{display:block;margin-top:4px;color:#809087;font-size:.72rem}
.sw-section{padding:17px 18px}.sw-section-head{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:11px;flex-wrap:wrap}.sw-section-head h3{margin:0;font-size:1rem;font-weight:850;color:#23392c}.sw-section-head p{margin:2px 0 0;color:#75847b;font-size:.78rem}.sw-muted{color:#77877e;font-size:.78rem}
.sw-filter{padding:12px;display:grid;grid-template-columns:repeat(4,minmax(120px,1fr)) minmax(180px,1.6fr) auto;gap:8px;align-items:end}.sw-field{display:grid;gap:4px}.sw-field label{font-size:.68rem;font-weight:800;color:#6c7b72;text-transform:uppercase;letter-spacing:.04em}.sw-field input,.sw-field select,.sw-field textarea{width:100%;min-height:37px;padding:7px 9px;border:1px solid #cfe0d4;border-radius:8px;background:#fff;color:#263a2e;font:inherit;font-size:.82rem;outline:none}.sw-field textarea{min-height:64px;resize:vertical}.sw-field input:focus,.sw-field select:focus,.sw-field textarea:focus{border-color:#78ac89;box-shadow:0 0 0 3px rgba(57,126,81,.08)}
.sw-table-wrap{overflow-x:auto;border:1px solid #dbe9df;border-radius:12px;background:#fff}.sw-table{width:100%;border-collapse:collapse;min-width:880px}.sw-table th{padding:9px 10px;background:#f4f9f5;color:#68786f;border-bottom:1px solid #dbe9df;text-align:left;font-size:.65rem;font-weight:850;text-transform:uppercase;letter-spacing:.04em;white-space:nowrap}.sw-table td{padding:10px;border-bottom:1px solid #e6efe8;color:#34483b;font-size:.78rem;vertical-align:middle}.sw-table tbody tr:last-child td{border-bottom:0}.sw-table tbody tr:hover td{background:#fbfdfb}.sw-ref{font-weight:800;color:#264b34}.sw-sub{display:block;color:#819088;font-size:.7rem;margin-top:2px}.sw-money{font-weight:850;color:#275f3b;white-space:nowrap}.sw-pill{display:inline-flex;align-items:center;min-height:24px;padding:3px 7px;border-radius:6px;border:1px solid #d6e5da;background:#f7fbf8;color:#496155;font-size:.68rem;font-weight:800;white-space:nowrap}.sw-pill.paid,.sw-pill.completed,.sw-pill.received,.sw-pill.closed,.sw-pill.forwarded{background:#eff8f1;border-color:#c7e2cf;color:#2d7548}.sw-pill.unpaid,.sw-pill.new,.sw-pill.requested{background:#fff8e9;border-color:#eed9a6;color:#8a641d}.sw-pill.partially_paid,.sw-pill.follow_up,.sw-pill.contacted,.sw-pill.dispatched{background:#f3f6ff;border-color:#cfd9f1;color:#47618f}.sw-pill.rejected,.sw-pill.cancelled{background:#fff1ef;border-color:#efcbc6;color:#a7473e}
.sw-note{padding:9px 11px;border:1px solid #dbe9df;border-radius:9px;background:#f7fbf8;color:#52665a;font-size:.76rem;line-height:1.4}.sw-attention{display:grid;gap:7px}.sw-attention-row{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:9px 10px;border:1px solid #e0ebe3;border-radius:9px;background:#fff}.sw-attention-row strong{font-size:.8rem}.sw-attention-row span{font-size:.74rem;color:#6f8076}.sw-empty{padding:24px 12px;text-align:center;color:#7b8a81;font-size:.8rem}
.sw-pager{display:flex;align-items:center;justify-content:space-between;gap:10px;padding-top:10px;flex-wrap:wrap}.sw-pager-info{font-size:.74rem;color:#74847a}.sw-page-links{display:flex;gap:5px;align-items:center}.sw-page{min-width:34px;height:34px;padding:0 9px;border:1px solid #cfe0d4;border-radius:8px;background:#fff;color:#2c7147;text-decoration:none;font-size:.75rem;font-weight:800;display:inline-flex;align-items:center;justify-content:center}.sw-page.active{background:#397e51;color:#fff;border-color:#397e51}.sw-page.disabled{opacity:.45;pointer-events:none}
