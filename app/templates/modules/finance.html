{% extends 'base.html' %}
{% block content %}
<div class="page-card">
    <h2>Finance Module</h2>
    <form method="post" class="grid-form two-col">
        <label>Amount <input type="text" name="amount" required></label>
        <label>Purpose <input type="text" name="purpose" required></label>
        <div class="span-2"><button type="submit">Submit Finance Request</button></div>
    </form>
    <table>
        <thead><tr><th>Amount</th><th>Purpose</th><th>Status</th></tr></thead>
        <tbody>
        {% for i in items %}
            <tr><td>{{ i.amount }}</td><td>{{ i.purpose }}</td><td>{{ i.status }}</td></tr>
        {% else %}
            <tr><td colspan="3">No finance requests.</td></tr>
        {% endfor %}
        </tbody>
    </table>
</div>
{% endblock %}
