{% extends 'base.html' %}
{% block content %}

<style>
    .page-card{
        width:100%;
        border:1px solid rgba(220,238,226,.95);
        border-radius:26px;
        padding:28px;
        background:rgba(255,255,255,.92);
        box-shadow:0 22px 55px rgba(23,37,42,.10);
        backdrop-filter:blur(14px);
        font-family:"Times New Roman", Georgia, serif;
    }

    .title-row{
        display:flex;
        align-items:flex-start;
        justify-content:space-between;
        gap:20px;
        margin-bottom:24px;
        flex-wrap:wrap;
    }

    .title-left{
    display:flex;
    align-items:center;
    gap:12px;
    min-width:0;
    flex:1 1 auto;
}

.title-left h2{
    margin:0;
    color:#17252A;
    font-size:clamp(1.25rem, 4.5vw, 1.9rem);
    font-weight:700;
    line-height:1.25;
    white-space:normal;
    word-break:break-word;
    overflow-wrap:anywhere;
    min-width:0;
}

    .back-btn{
        display:none;
        width:42px;
        height:42px;
        border:none;
        border-radius:14px;
        align-items:center;
        justify-content:center;
        background:rgba(228,247,234,.82);
        color:#3B7D55;
        font-size:1.65rem;
        font-weight:700;
        cursor:pointer;
        box-shadow:0 8px 20px rgba(95,168,120,.12);
        transition:all .2s ease;
    }

    .back-btn:hover{
        background:#5FA878;
        color:#fff;
        transform:translateX(-2px);
    }

    .table-actions{
        display:flex;
        align-items:center;
        gap:10px;
        margin:0;
        flex-wrap:wrap;
    }

    .table-actions input{
        width:320px;
        max-width:100%;
        min-height:42px;
        padding:9px 14px;
        border:1px solid rgba(95,168,120,.25);
        border-radius:14px;
        background:#fff;
        color:#334155;
        font-family:"Times New Roman", Georgia, serif;
        font-size:1rem;
        outline:none;
    }

    .table-actions button{
        min-height:42px;
        padding:9px 20px;
        border:none;
        border-radius:999px;
        background:#5FA878;
        color:#fff;
        font-family:"Times New Roman", Georgia, serif;
        font-size:1rem;
        font-weight:700;
        cursor:pointer;
        box-shadow:0 12px 26px rgba(95,168,120,.22);
        transition:all .2s ease;
    }

    .table-actions button:hover{
        background:#3B7D55;
        transform:translateY(-1px);
    }

    .table-actions .clear-btn{
    background:#FEE2E2;
    color:#B91C1C;
    border:none;
    box-shadow:none;
}

.table-actions .clear-btn:hover{
    background:#B91C1C;
    color:#fff;
}


    .table-actions .clear-link{
    display:inline-flex;
    align-items:center;
    justify-content:center;
    min-height:42px;
    padding:9px 20px;
    border-radius:999px;
    text-decoration:none;
    font-family:"Times New Roman", Georgia, serif;
    font-size:1rem;
    font-weight:700;
}

@media (max-width:860px){
    .table-actions .clear-link{
        width:100%;
    }
}

    .table-controls{
        display:flex;
        align-items:flex-end;
        justify-content:space-between;
        gap:16px;
        margin-bottom:16px;
        flex-wrap:wrap;
    }

    .pagination-size{
        display:flex;
        flex-direction:column;
        gap:8px;
        color:#425466;
        font-weight:700;
    }

    .pagination-size select{
        width:120px;
        min-height:42px;
        padding:8px 12px;
        border:1px solid rgba(95,168,120,.25);
        border-radius:12px;
        background:#fff;
        color:#334155;
        font-family:"Times New Roman", Georgia, serif;
        font-size:1rem;
        font-weight:700;
        outline:none;
    }

    .table-info{
        margin-bottom:16px;
        padding:10px 16px;
        border:1px solid rgba(95,168,120,.18);
        border-radius:16px;
        background:rgba(228,247,234,.42);
        color:#3B7D55;
        font-weight:700;
    }

    .master-table-wrap{
        width:100%;
        overflow-x:auto;
        overflow-y:hidden;
        border:1px solid rgba(220,238,226,.95);
        border-radius:22px;
        background:#fff;
        box-shadow:0 14px 32px rgba(23,37,42,.06);
        cursor:grab;
        scrollbar-width:auto;
        scrollbar-color:#94A3B8 #F1F5F9;
    }

    .master-table-wrap:active{
        cursor:grabbing;
    }

    .master-table-wrap::-webkit-scrollbar{
        height:12px;
    }

    .master-table-wrap::-webkit-scrollbar-track{
        background:#F1F5F9;
        border-radius:999px;
    }

    .master-table-wrap::-webkit-scrollbar-thumb{
        background:#94A3B8;
        border-radius:999px;
        border:2px solid #F1F5F9;
    }

    .master-table-wrap table{
        width:max-content;
        min-width:100%;
        table-layout:fixed;
        border-collapse:separate;
        border-spacing:0;
        background:#fff;
    }

    .master-table-wrap th,
    .master-table-wrap td{
        width:150px;
        height:72px;
        max-width:150px;
        min-width:150px;
        padding:12px 14px;
        border-right:1px solid rgba(220,238,226,.85);
        border-bottom:1px solid rgba(220,238,226,.85);
        color:#425466;
        font-size:1rem;
        line-height:1.3;
        text-align:left;
        vertical-align:middle;
        white-space:normal;
        word-break:break-word;
        overflow:hidden;
    }

    .master-table-wrap th{
        height:58px;
        color:#17252A;
        font-weight:700;
        background:rgba(228,247,234,.92);
    }

    .master-table-wrap td{
        background:#fff;
    }

    .master-table-wrap tr:hover td{
        background:rgba(246,251,247,.9);
    }

    .master-table-wrap tr:last-child td{
        border-bottom:none;
    }

    .master-table-wrap th:last-child,
    .master-table-wrap td:last-child{
        border-right:none;
    }

    .pagination-bar{
        display:flex;
        align-items:center;
        justify-content:flex-end;
        gap:8px;
        margin-top:18px;
        flex-wrap:wrap;
    }

    .page-btn{
        min-width:38px;
        height:38px;
        padding:0 12px;
        border:1px solid rgba(95,168,120,.25);
        border-radius:12px;
        color:#3B7D55;
        background:rgba(228,247,234,.58);
        font-family:"Times New Roman", Georgia, serif;
        font-weight:700;
        cursor:pointer;
    }

    .page-btn:hover,
    .page-btn.active{
        color:#fff;
        background:#5FA878;
        border-color:#5FA878;
    }

    .page-btn:disabled{
        opacity:.45;
        cursor:not-allowed;
    }

    .pagination-bar a.page-btn{
    display:inline-flex;
    align-items:center;
    justify-content:center;
    text-decoration:none;
}

.page-btn.disabled{
    opacity:.45;
    pointer-events:none;
    cursor:not-allowed;
}

    @media (max-width:860px){
       .back-btn{
    display:inline-flex;
    flex:0 0 auto;
}

.page-card{
    padding:22px;
    border-radius:22px;
    overflow:hidden;
}

.title-row{
    flex-direction:column;
    align-items:stretch;
    gap:16px;
}

.title-left{
    width:100%;
    align-items:flex-start;
}

.title-left h2{
    flex:1;
    max-width:100%;
    font-size:clamp(1.2rem, 5vw, 1.55rem);
}

       .table-actions,
.table-actions input,
.table-actions button,
.table-actions .clear-link{
    width:100%;
}

        .table-controls{
            flex-direction:column;
            align-items:stretch;
        }

        .master-table-wrap{
            border:none;
            box-shadow:none;
            background:transparent;
            overflow-x:auto;
            -webkit-overflow-scrolling:touch;
        }

        .master-table-wrap table{
            display:flex;
            width:max-content;
            min-width:100%;
            background:transparent;
        }

        .master-table-wrap thead{
            display:none;
        }

        .master-table-wrap tbody{
            display:flex;
            gap:14px;
            overflow-x:auto;
            -webkit-overflow-scrolling:touch;
            padding:4px 2px 8px;
        }

        .master-table-wrap tbody tr{
            width:290px;
            min-width:290px;
            max-width:290px;
            min-height:360px;
            flex:0 0 auto;
            display:block;
            border:1px solid rgba(220,238,226,.95);
            border-radius:18px;
            background:#fff;
            padding:15px;
            box-shadow:0 10px 24px rgba(23,37,42,.06);
        }

        .master-table-wrap td{
            display:block;
            width:100%;
            min-width:0;
            max-width:none;
            height:auto;
            min-height:58px;
            border:none;
            padding:7px 0;
            white-space:normal;
            word-break:break-word;
            overflow:visible;
            background:transparent;
        }

        .master-table-wrap td::before{
            content:attr(data-label);
            display:block;
            color:#64748B;
            font-size:.85rem;
            font-weight:700;
            margin-bottom:2px;
        }

        .pagination-bar{
            justify-content:center;
        }
    }

    @media (max-width:420px){
    .page-card{
        padding:14px;
        border-radius:18px;
    }

    .title-left{
        gap:10px;
    }

    .title-left h2{
        font-size:1.22rem;
        line-height:1.25;
    }

    .back-btn{
        width:36px;
        height:36px;
        border-radius:12px;
        font-size:1.35rem;
    }

    .master-table-wrap tbody tr{
        width:265px;
        min-width:265px;
        max-width:265px;
    }
}
</style>

<div class="page-card">
  <div class="title-row">
    <div class="title-left">
        <button type="button" class="back-btn" onclick="history.back()" aria-label="Back">←</button>
        <h2>{{ title }}</h2>
    </div>

    <form method="get" class="table-actions" id="masterSearchForm">
  <input 
      type="text" 
      id="masterSearchInput" 
      name="q" 
      value="{{ q or '' }}" 
      placeholder="Search records"
  >

  <button type="submit" id="masterSearchBtn">Search</button>

  {% if q %}
  <a href="{{ request.path }}" class="clear-btn clear-link" id="masterClearBtn">
      Clear
  </a>
  {% endif %}
</form>
  </div>

  <div class="table-controls">
      <label class="pagination-size">
          <span>Show entries</span>
       <select id="masterRowsPerPage">
    <option value="25" selected>25</option>
    <option value="50">50</option>
    <option value="250">250</option>
    <option value="1000">1000</option>
</select>
      </label>
  </div>

  <div class="table-info" id="masterPaginationInfo"></div>

{% if q %}
<div class="table-info">
    Search result for "{{ q }}"
</div>
{% endif %}

  <div class="master-table-wrap" id="masterTableScroll">
      {% include 'master/_table.html' %}
  </div>

<div class="pagination-bar" id="masterPaginationBar"></div>

<script>
(function(){
    const table = document.querySelector('.master-table-wrap table');
    const select = document.getElementById('masterRowsPerPage');
    const info = document.getElementById('masterPaginationInfo');
    const pager = document.getElementById('masterPaginationBar');
    const scrollBox = document.getElementById('masterTableScroll');

    if(!table || !select || !info || !pager) return;

    const headerCells = Array.from(table.querySelectorAll('thead th')).map(th => th.textContent.trim());
    const rows = Array.from(table.querySelectorAll('tbody tr'));
    const noData = rows.length === 1 && rows[0].querySelector('td[colspan]');
    let currentPage = 1;

    rows.forEach(row => {
        Array.from(row.children).forEach((cell, index) => {
            if(!cell.hasAttribute('data-label')){
                cell.setAttribute('data-label', headerCells[index] || '');
            }
        });
    });

    function renderPagination(){
        const perPage = parseInt(select.value, 10);
        const totalRows = noData ? 0 : rows.length;

        rows.forEach(row => row.style.display = 'none');

        if(noData || totalRows === 0){
            info.textContent = 'No records found';
            pager.innerHTML = '';
            rows.forEach(row => row.style.display = '');
            return;
        }

        const totalPages = Math.max(1, Math.ceil(totalRows / perPage));
        currentPage = Math.min(currentPage, totalPages);

        const start = (currentPage - 1) * perPage;
        const end = start + perPage;

        rows.forEach((row, index) => {
            row.style.display = index >= start && index < end ? '' : 'none';
        });

        info.textContent = `Showing ${start + 1} to ${Math.min(end, totalRows)} of ${totalRows} entries`;

        pager.innerHTML = '';

        const prev = document.createElement('button');
        prev.type = 'button';
        prev.className = 'page-btn';
        prev.textContent = 'Prev';
        prev.disabled = currentPage === 1;
        prev.onclick = () => {
            currentPage--;
            renderPagination();
        };
        pager.appendChild(prev);

        for(let i = 1; i <= totalPages; i++){
            if(i === 1 || i === totalPages || Math.abs(i - currentPage) <= 1){
                const btn = document.createElement('button');
                btn.type = 'button';
                btn.className = 'page-btn' + (i === currentPage ? ' active' : '');
                btn.textContent = i;
                btn.onclick = () => {
                    currentPage = i;
                    renderPagination();
                };
                pager.appendChild(btn);
            }
        }

        const next = document.createElement('button');
        next.type = 'button';
        next.className = 'page-btn';
        next.textContent = 'Next';
        next.disabled = currentPage === totalPages;
        next.onclick = () => {
            currentPage++;
            renderPagination();
        };
        pager.appendChild(next);
    }

    select.addEventListener('change', function(){
        currentPage = 1;
        renderPagination();
    });

    if(scrollBox){
        let isDown = false;
        let startX;
        let scrollLeft;

        scrollBox.addEventListener('mousedown', function(e){
            isDown = true;
            startX = e.pageX - scrollBox.offsetLeft;
            scrollLeft = scrollBox.scrollLeft;
        });

        scrollBox.addEventListener('mouseleave', function(){
            isDown = false;
        });

        scrollBox.addEventListener('mouseup', function(){
            isDown = false;
        });

        scrollBox.addEventListener('mousemove', function(e){
            if(!isDown) return;
            e.preventDefault();
            const x = e.pageX - scrollBox.offsetLeft;
            const walk = (x - startX) * 1.4;
            scrollBox.scrollLeft = scrollLeft - walk;
        });
    }

    renderPagination();
})();
</script>

{% endblock %}
