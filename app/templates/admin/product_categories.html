{% extends 'base.html' %}
{% block content %}
<div class="page-card">
    <h2>Product Categories</h2>

    <form method="post" class="grid-form two-col">
        <label>Category Name
            <input type="text" name="name" placeholder="Example: Seeds, Fertilizer, Pig Feed" required>
        </label>

        <div style="display:flex;align-items:end;gap:10px;">
            <button type="submit">Add Category</button>
            <a href="{{ url_for('admin.add_product') }}">Back to Add Product</a>
        </div>
    </form>

    <h3>Available Categories</h3>

    <table>
        <thead>
            <tr>
                <th>Category Name</th>
                <th>Created At</th>
            </tr>
        </thead>
        <tbody>
        {% for c in categories %}
            <tr>
                <td>{{ c.name }}</td>
                <td>{{ c.created_at }}</td>
            </tr>
        {% else %}
            <tr>
                <td colspan="2">No product categories added yet.</td>
            </tr>
        {% endfor %}
        </tbody>
    </table>
</div>
{% endblock %}
