{% extends 'base.html' %}
{% block content %}
<div class="page-card narrow-card">
    <h2>Reset User Password</h2>
    <div class="info-banner">
        User: <strong>{{ user.name }}</strong> | Role: <strong>{{ user.role }}</strong> | Username/Phone: <strong>{{ user.username or user.phone }}</strong>
    </div>
    <form method="post" class="grid-form">
        <label>New Password <input type="password" name="password" required minlength="6"></label>
        <label>Confirm Password <input type="password" name="confirm_password" required minlength="6"></label>
        <button type="submit">Reset Password</button>
        <a class="btn-link" href="{{ url_for('admin.users') }}">Back to Users</a>
    </form>
</div>
{% endblock %}
