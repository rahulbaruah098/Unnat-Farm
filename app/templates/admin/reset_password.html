{% extends 'base.html' %}

{% block content %}

<style>
    .page-card {
        width: 100%;
        border: 1px solid rgba(220, 238, 226, .95);
        border-radius: 26px;
        padding: 28px;
        background: rgba(255, 255, 255, .92);
        box-shadow: 0 22px 55px rgba(23, 37, 42, .10);
        backdrop-filter: blur(14px);
        font-family: "Times New Roman", Georgia, serif;
        overflow: hidden;
    }

    .narrow-card {
        max-width: 760px;
        margin: 0 auto;
    }

    .reset-header {
    display: block;
    align-items: flex-start;
    justify-content: flex-start;
    gap: 14px;
    margin-bottom: 22px;
    width: 100%;
}

.mobile-back-btn {
    display: inline-flex;
    width: 42px;
    height: 42px;
    border: none;
    border-radius: 14px;
    align-items: center;
    justify-content: center;
    background: rgba(228, 247, 234, .82);
    color: #3B7D55;
    font-size: 1.65rem;
    font-weight: 700;
    cursor: pointer;
    box-shadow: 0 8px 20px rgba(95, 168, 120, .12);
    transition: all .2s ease;
    line-height: 1;
    text-decoration: none;
    flex: 0 0 auto;
    margin-top: 0;
}

.mobile-back-btn:hover {
    background: #5FA878;
    color: #fff;
    transform: translateX(-2px);
}

.reset-title-wrap {
    min-width: 0;
    flex: 1;
}

.reset-title-line {
    display: flex;
    align-items: center;
    gap: 14px;
}

    .reset-kicker {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        min-height: 30px;
        padding: 6px 14px;
        margin-bottom: 10px;
        border-radius: 999px;
        background: rgba(228, 247, 234, .72);
        color: #3B7D55;
        border: 1px solid rgba(95, 168, 120, .22);
        font-size: .82rem;
        font-weight: 800;
        letter-spacing: .08em;
        text-transform: uppercase;
    }

    .page-card h2 {
        margin: 0;
        color: #17252A;
        font-size: clamp(1.55rem, 2.4vw, 2.15rem);
        font-weight: 800;
        line-height: 1.2;
        letter-spacing: .2px;
        white-space: normal;
        overflow-wrap: anywhere;
        word-break: break-word;
    }

    .reset-subtitle {
        margin: 10px 0 0;
        color: #64748B;
        font-size: 1rem;
        line-height: 1.6;
        font-weight: 600;
    }

    .info-banner {
        margin: 0 0 22px;
        padding: 15px 18px;
        border: 1px solid rgba(95, 168, 120, .18);
        border-radius: 18px;
        background: rgba(228, 247, 234, .42);
        color: #334155;
        font-size: 1rem;
        font-weight: 700;
        line-height: 1.6;
        overflow-wrap: anywhere;
        word-break: break-word;
    }

    .info-banner strong {
        color: #3B7D55;
        font-weight: 900;
    }

    .grid-form {
        display: grid;
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 18px;
        padding: 22px;
        border: 1px solid rgba(220, 238, 226, .95);
        border-radius: 22px;
        background: linear-gradient(180deg, rgba(255, 255, 255, .98), rgba(246, 251, 247, .92));
        box-shadow: 0 14px 32px rgba(23, 37, 42, .06);
    }

    .grid-form label {
        display: flex;
        flex-direction: column;
        gap: 8px;
        color: #17252A;
        font-size: 1.02rem;
        font-weight: 800;
        line-height: 1.25;
    }

    .grid-form input {
        width: 100%;
        min-height: 46px;
        padding: 10px 14px;
        border: 1px solid rgba(95, 168, 120, .25);
        border-radius: 14px;
        background: #fff;
        color: #334155;
        font-family: "Times New Roman", Georgia, serif;
        font-size: 1rem;
        outline: none;
        transition: all .2s ease;
    }

    .grid-form input:focus {
        border-color: rgba(95, 168, 120, .58);
        box-shadow: 0 0 0 4px rgba(95, 168, 120, .12);
    }

    .grid-form button {
        min-height: 46px;
        padding: 10px 22px;
        border: none;
        border-radius: 999px;
        background: #5FA878;
        color: #fff;
        font-family: "Times New Roman", Georgia, serif;
        font-size: 1rem;
        font-weight: 800;
        cursor: pointer;
        box-shadow: 0 12px 26px rgba(95, 168, 120, .22);
        transition: all .2s ease;
    }

    .grid-form button:hover {
        background: #3B7D55;
        transform: translateY(-1px);
    }

    .btn-link {
        min-height: 46px;
        padding: 10px 22px;
        border-radius: 999px;
        background: #EEF2FF;
        color: #4338CA;
        font-family: "Times New Roman", Georgia, serif;
        font-size: 1rem;
        font-weight: 800;
        text-decoration: none;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        transition: all .2s ease;
    }

    .btn-link:hover {
        background: #4338CA;
        color: #fff;
        transform: translateY(-1px);
    }

   @media (max-width: 860px) {
    .page-card {
        padding: 22px;
        border-radius: 22px;
    }

    .reset-header {
    margin-bottom: 18px;
}

.reset-title-line {
    gap: 12px;
}

    .narrow-card {
        max-width: 100%;
    }

    .page-card h2 {
        font-size: clamp(1.35rem, 5.5vw, 1.85rem);
    }

    .reset-subtitle {
        font-size: .95rem;
        line-height: 1.5;
    }

    .info-banner {
        padding: 14px 16px;
        border-radius: 16px;
        font-size: .96rem;
    }

    .grid-form {
        grid-template-columns: 1fr;
        gap: 16px;
        padding: 18px;
        border-radius: 20px;
    }

    .grid-form button,
    .btn-link {
        width: 100%;
    }
}

   @media (max-width: 420px) {
    .page-card {
        padding: 16px;
        border-radius: 18px;
    }

    .mobile-back-btn {
        width: 38px;
        height: 38px;
        border-radius: 12px;
        font-size: 1.45rem;
    }

    .reset-kicker {
        font-size: .72rem;
        padding: 5px 11px;
    }

    .page-card h2 {
        font-size: 1.35rem;
        line-height: 1.22;
    }

    .reset-subtitle {
        font-size: .9rem;
    }

    .info-banner {
        font-size: .92rem;
        padding: 12px 14px;
    }

    .grid-form {
        padding: 15px;
        border-radius: 18px;
    }

    .grid-form label {
        font-size: .96rem;
    }

    .grid-form input,
    .grid-form button,
    .btn-link {
        min-height: 44px;
    }
}
</style>

<div class="page-card narrow-card">
<div class="reset-header">
    <div class="reset-title-wrap">
        <span class="reset-kicker">User Security</span>

        <div class="reset-title-line">
            <button type="button" class="mobile-back-btn" onclick="history.back()" aria-label="Back">←</button>
            <h2>Reset User Password</h2>
        </div>

        <p class="reset-subtitle">Update the selected user password securely.</p>
    </div>
</div>

    <div class="info-banner">
        User: <strong>{{ user.name }}</strong> |
        Role: <strong>{{ user.role }}</strong> |
        Username/Phone: <strong>{{ user.username or user.phone }}</strong>
    </div>

   <form method="post" class="grid-form" autocomplete="off">
    <label>
        New Password
        <input 
            type="password" 
            name="password" 
            required 
            minlength="6"
            autocomplete="new-password"
            data-lpignore="true"
            data-form-type="other"
        >
    </label>

    <label>
        Confirm Password
        <input 
            type="password" 
            name="confirm_password" 
            required 
            minlength="6"
            autocomplete="new-password"
            data-lpignore="true"
            data-form-type="other"
        >
    </label>

    <button type="submit">Reset Password</button>
    <a class="btn-link" href="{{ url_for('admin.users') }}">Back to Users</a>
</form>
</div>

{% endblock %}
