{% extends 'base.html' %}
{% block content %}

<style>
    .page-card{
        width:100%;
        border:1px solid rgba(220,238,226,.95);
        border-radius:26px;
        padding:28px;
        background:#fff;
        box-shadow:0 22px 55px rgba(23,37,42,.10);
        font-family:"Times New Roman", Georgia, serif;
        overflow:hidden;
    }

    .title-row{
        display:flex;
        align-items:center;
        justify-content:space-between;
        gap:20px;
        margin-bottom:22px;
        flex-wrap:wrap;
    }

    .title-left{
        display:flex;
        align-items:center;
        gap:12px;
        min-width:0;
    }

    .title-left h2{
        margin:0;
        color:#17252A;
        font-size:clamp(1.45rem, 2.1vw, 1.9rem);
        font-weight:800;
        line-height:1.25;
        white-space:nowrap;
    }

    .back-btn{
        display:none;
        width:42px;
        height:42px;
        border:none;
        border-radius:14px;
        align-items:center;
        justify-content:center;
        background:rgba(228,247,234,.82);
        color:#3B7D55;
        font-size:1.65rem;
        font-weight:700;
        cursor:pointer;
        box-shadow:0 8px 20px rgba(95,168,120,.12);
        transition:all .2s ease;
        flex:0 0 auto;
    }

    .back-btn:hover{
        background:#5FA878;
        color:#fff;
        transform:translateX(-2px);
    }

    .manage-link{
        display:inline-flex;
        align-items:center;
        justify-content:center;
        min-height:42px;
        padding:9px 18px;
        border-radius:999px;
        background:rgba(228,247,234,.82);
        color:#3B7D55;
        border:1px solid rgba(95,168,120,.25);
        text-decoration:none;
        font-size:1rem;
        font-weight:800;
        transition:all .2s ease;
        white-space:nowrap;
    }

    .manage-link:hover{
        background:#5FA878;
        color:#fff;
        transform:translateY(-1px);
    }

    .product-layout{
        display:grid;
        grid-template-columns:minmax(0, 1fr) 360px;
        gap:24px;
        align-items:start;
    }

    .form-card{
        padding:22px;
        border:1px solid rgba(220,238,226,.95);
        border-radius:24px;
        background:linear-gradient(180deg, rgba(255,255,255,.98), rgba(246,251,247,.94));
        box-shadow:0 14px 32px rgba(23,37,42,.06);
    }

    .grid-form{
        display:grid;
        grid-template-columns:repeat(2, minmax(0, 1fr));
        gap:16px;
    }

    .grid-form label{
        display:flex;
        flex-direction:column;
        gap:8px;
        color:#17252A;
        font-size:1.02rem;
        font-weight:800;
    }

    .grid-form input,
    .grid-form select{
        width:100%;
        min-height:44px;
        padding:10px 14px;
        border:1px solid rgba(95,168,120,.25);
        border-radius:14px;
        background:#fff;
        color:#334155;
        font-family:"Times New Roman", Georgia, serif;
        font-size:1rem;
        outline:none;
        transition:all .2s ease;
    }

    .grid-form select[multiple]{
        min-height:142px;
        padding:10px 12px;
    }

    .grid-form input:focus,
    .grid-form select:focus{
        border-color:rgba(95,168,120,.55);
        box-shadow:0 0 0 4px rgba(95,168,120,.12);
    }

    .field-note{
        display:block;
        margin-top:6px;
        color:#64748B;
        font-family:Inter, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        font-size:.86rem;
        font-weight:650;
        line-height:1.35;
    }

    .file-input{
        padding:9px 12px !important;
        cursor:pointer;
    }

    .span-2{
        grid-column:1 / -1;
        display:flex;
        justify-content:flex-end;
        margin-top:4px;
    }

    .submit-btn{
        min-height:44px;
        padding:10px 24px;
        border:none;
        border-radius:999px;
        background:#5FA878;
        color:#fff;
        font-family:"Times New Roman", Georgia, serif;
        font-size:1rem;
        font-weight:800;
        cursor:pointer;
        box-shadow:0 12px 26px rgba(95,168,120,.22);
        transition:all .2s ease;
    }

    .submit-btn:hover{
        background:#3B7D55;
        transform:translateY(-1px);
    }

    .preview-panel{
        position:sticky;
        top:calc(var(--header-h, 74px) + 20px);
        padding:20px;
        border:1px solid rgba(220,238,226,.95);
        border-radius:24px;
        background:#fff;
        box-shadow:0 14px 32px rgba(23,37,42,.06);
    }

    .preview-heading{
        margin:0 0 16px;
        color:#17252A;
        font-size:1.25rem;
        font-weight:900;
        line-height:1.25;
    }

    .product-item{
        display:grid;
        grid-template-columns:minmax(0, 1fr) 132px;
        gap:16px;
        align-items:start;
        padding:18px 0;
        border-top:1px dashed rgba(148,163,184,.48);
        border-bottom:1px dashed rgba(148,163,184,.48);
    }

    .product-info{
        min-width:0;
    }

    .product-type{
        width:23px;
        height:23px;
        border:2px solid #A16207;
        border-radius:6px;
        display:flex;
        align-items:center;
        justify-content:center;
        margin-bottom:11px;
    }

    .product-type::after{
        content:"";
        width:0;
        height:0;
        border-left:6px solid transparent;
        border-right:6px solid transparent;
        border-bottom:10px solid #A16207;
    }

    .product-name{
        margin:0 0 10px;
        color:#1F2937;
        font-family:Inter, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        font-size:1.16rem;
        font-weight:850;
        line-height:1.25;
        word-break:break-word;
    }

    .rating-row{
        display:flex;
        align-items:center;
        gap:7px;
        margin-bottom:10px;
        color:#111827;
        font-family:Inter, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        font-size:.92rem;
        font-weight:800;
    }

    .stars{
        color:#EAB308;
        letter-spacing:0;
        white-space:nowrap;
    }

    .product-price{
        margin-bottom:10px;
        color:#1F2937;
        font-family:Inter, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        font-size:1.06rem;
        font-weight:900;
    }

    .product-desc{
        color:#64748B;
        font-family:Inter, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        font-size:.92rem;
        font-weight:650;
        line-height:1.45;
        word-break:break-word;
    }

    .product-side{
        display:flex;
        flex-direction:column;
        align-items:center;
        justify-content:flex-start;
        min-width:0;
    }

    .product-image{
        width:128px;
        height:112px;
        border-radius:20px;
        background:linear-gradient(135deg, #EAF7EE 0%, #FFFFFF 100%);
        border:1px solid rgba(95,168,120,.18);
        display:flex;
        align-items:center;
        justify-content:center;
        color:#3B7D55;
        box-shadow:0 12px 24px rgba(95,168,120,.13);
        overflow:hidden;
    }

    .product-image svg{
        width:50px;
        height:50px;
    }

    .add-btn{
        width:104px;
        min-height:42px;
        margin-top:-20px;
        border:1px solid #EF8BA0;
        border-radius:14px;
        background:#FFF7F9;
        color:#E84B68;
        font-family:Inter, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        font-size:1.08rem;
        font-weight:900;
        display:flex;
        align-items:center;
        justify-content:center;
        gap:7px;
        box-shadow:0 10px 18px rgba(232,75,104,.12);
        position:relative;
        z-index:2;
    }

    .add-btn span{
        font-size:1rem;
        line-height:1;
    }

    .customisable{
        margin-top:7px;
        color:#94A3B8;
        font-family:Inter, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        font-size:.78rem;
        font-weight:800;
        text-align:center;
    }

    @media (max-width:1100px){
        .product-layout{
            grid-template-columns:1fr;
        }

        .preview-panel{
            position:relative;
            top:auto;
        }
    }

    @media (max-width:860px){
        .back-btn{
            display:inline-flex;
        }

        .page-card{
            padding:22px;
            border-radius:22px;
        }

        .title-row{
            flex-direction:column;
            align-items:stretch;
        }

        .manage-link{
            width:100%;
        }

        .grid-form{
            grid-template-columns:1fr;
        }

        .span-2,
        .submit-btn{
            width:100%;
        }

        .product-item{
            grid-template-columns:minmax(0, 1fr) 118px;
            gap:14px;
        }

        .product-image{
            width:112px;
            height:100px;
            border-radius:18px;
        }

        .product-image svg{
            width:42px;
            height:42px;
        }

        .add-btn{
            width:96px;
            min-height:40px;
            font-size:1rem;
        }
    }

    @media (max-width:560px){
        .page-card{
            padding:16px;
            border-radius:18px;
        }

        .title-left h2{
            font-size:1.35rem;
        }

        .form-card,
        .preview-panel{
            padding:16px;
            border-radius:20px;
        }

        .product-item{
            grid-template-columns:minmax(0, 1fr) 100px;
            gap:12px;
            padding:18px 0;
        }

        .product-type{
            width:20px;
            height:20px;
            border-radius:5px;
            margin-bottom:9px;
        }

        .product-type::after{
            border-left-width:5px;
            border-right-width:5px;
            border-bottom-width:8px;
        }

        .product-name{
            font-size:1.04rem;
        }

        .product-desc{
            font-size:.86rem;
        }

        .product-image{
            width:96px;
            height:88px;
        }

        .add-btn{
            width:84px;
            min-height:38px;
            font-size:.92rem;
            border-radius:12px;
        }
    }

    @media (max-width:420px){
        .back-btn{
            width:38px;
            height:38px;
            border-radius:12px;
            font-size:1.45rem;
        }

        .product-item{
            grid-template-columns:1fr 88px;
            gap:10px;
        }

        .product-image{
            width:84px;
            height:78px;
        }
    }
</style>

<div class="page-card">
    <div class="title-row">
        <div class="title-left">
            <button type="button" class="back-btn" onclick="history.back()" aria-label="Back">←</button>
            <h2>Add Product</h2>
        </div>

        <a href="{{ url_for('admin.product_categories') }}" class="manage-link">
            Manage Product Categories
        </a>
    </div>

    <div class="product-layout">
        <div class="form-card">
            <form method="post" enctype="multipart/form-data" class="grid-form">
                <label>
                    Name
                    <input type="text" name="name" required>
                </label>

                <label>
                    Category
                    <select name="category" required>
                        <option value="">Select Category</option>
                        {% for c in categories %}
                            <option value="{{ c.name }}">{{ c.name }}</option>
                        {% endfor %}
                    </select>
                </label>

                <label>
                    Type
                    <select name="type" required>
                        <option value="">Select Type</option>
                        <option value="input">Input</option>
                        <option value="output">Output</option>
                    </select>
                </label>

                <label>
                    Available Centres
                    <select name="available_centres" multiple required>
                        <option value="all">All Centres</option>
                        {% for centre in centres %}
                            <option value="{{ centre.centre_uid }}">
                                {{ centre.centre_uid }}
                                {% if centre.name %} - {{ centre.name }}{% endif %}
                            </option>
                        {% endfor %}
                    </select>
                    <small class="field-note">
                        Hold CTRL to select multiple centres, or select “All Centres”.
                    </small>
                </label>

                <label>
                    Price
                    <input type="text" name="price" required>
                </label>

                <label>
                    Product Image
                    <input type="file" name="product_image" accept="image/*" class="file-input">
                </label>

                <div class="span-2">
                    <button type="submit" class="submit-btn">Save Product</button>
                </div>
            </form>
        </div>

        <aside class="preview-panel">
            <h3 class="preview-heading">Product Preview</h3>

            <article class="product-item">
                <div class="product-info">
                    <div class="product-type" aria-hidden="true"></div>

                    <h3 class="product-name">Product Name</h3>

                    <div class="rating-row">
                        <span class="stars">★★★★☆</span>
                        <span>(New)</span>
                    </div>

                    <div class="product-price">₹ Price</div>

                    <div class="product-desc">
                        Category / Type / Available Centres
                    </div>
                </div>

                <div class="product-side">
                    <div class="product-image" aria-hidden="true">
                        <svg viewBox="0 0 24 24" fill="none">
                            <path d="M4 7.5L12 3l8 4.5v9L12 21l-8-4.5v-9Z" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/>
                            <path d="M4.5 8L12 12.2 19.5 8M12 21v-8.8" stroke="currentColor" stroke-width="1.8"/>
                        </svg>
                    </div>

                    <div class="add-btn">ADD <span>+</span></div>
                    <div class="customisable">preview</div>
                </div>
            </article>
        </aside>
    </div>
</div>

{% endblock %}
