{% extends 'base.html' %}
{% block content %}
<div class="page-card">
    <h2>Add Product</h2>
    <form method="post" class="grid-form two-col">
        <label>Name <input type="text" name="name" required></label>
        <label>Category <input type="text" name="category" required></label>
        <label>Type <input type="text" name="type" placeholder="input / output"></label>
        <label>Available Centres <input type="text" name="available_centres" placeholder="comma separated centre IDs"></label>
        <label>Price <input type="text" name="price" required></label>
        <div class="span-2"><button type="submit">Save Product</button></div>
    </form>
</div>
{% endblock %}
