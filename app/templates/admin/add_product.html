{% extends 'base.html' %}
{% block content %}

<style>
.page-card{
    width:100%;
    border:1px solid rgba(220,238,226,.95);
    border-radius:24px;
    padding:26px;
    background:#fff;
    box-shadow:0 18px 45px rgba(15,23,42,.08);
    font-family:"Times New Roman", Georgia, serif;
}

/* HEADER */
.title-row{
    display:flex;
    justify-content:space-between;
    align-items:center;
    margin-bottom:22px;
    flex-wrap:wrap;
    gap:14px;
}

.title-left{
    display:flex;
    align-items:center;
    gap:10px;
}

.title-left h2{
    margin:0;
    font-size:1.6rem;
    font-weight:700;
    color:#0F172A;
}

.back-btn{
    display:none;
    width:40px;
    height:40px;
    border:none;
    border-radius:12px;
    background:#E4F7EA;
    color:#3B7D55;
    font-size:18px;
    cursor:pointer;
}

/* ACTION BUTTONS */
.page-actions{
    display:flex;
    gap:10px;
    flex-wrap:wrap;
}

.page-actions a{
    padding:8px 16px;
    border-radius:999px;
    text-decoration:none;
    font-weight:600;
    border:1px solid rgba(95,168,120,.25);
    background:rgba(228,247,234,.82);
    color:#3B7D55;
}

.page-actions a:first-child{
    background:#5FA878;
    color:#fff;
}

/* FORM GRID */
.form-grid{
    display:grid;
    grid-template-columns:repeat(2,1fr);
    gap:18px;
}

.full{
    grid-column:1/-1;
}

/* INPUTS */
label{
    font-weight:600;
    color:#334155;
    display:flex;
    flex-direction:column;
    gap:6px;
}

input,
select{
    height:44px;
    border-radius:12px;
    border:1px solid #E2E8F0;
    padding:0 12px;
    font-size:14px;
    font-family:"Times New Roman", Georgia, serif;
}

input:focus,
select:focus{
    outline:none;
    border-color:rgba(95,168,120,.65);
    box-shadow:0 0 0 4px rgba(95,168,120,.12);
}

/* CUSTOM CENTRE DROPDOWN */
.centre-dropdown{
    position:relative;
}

.centre-select-display{
    width:100%;
    min-height:46px;
    border:1px solid #E2E8F0;
    border-radius:12px;
    background:#fff;
    padding:0 14px;
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:10px;
    cursor:pointer;
    color:#3B7D55;
    font-weight:600;
}

.centre-select-display span{
    overflow:hidden;
    text-overflow:ellipsis;
    white-space:nowrap;
}

.centre-arrow{
    color:#3B7D55;
    font-size:16px;
    transition:.2s ease;
}

.centre-dropdown.open .centre-arrow{
    transform:rotate(180deg);
}

.centre-menu{
    display:none;
    position:absolute;
    left:0;
    right:0;
    top:calc(100% + 8px);
    z-index:9999;

    border:1px solid #DCEEE2;
    border-radius:16px;
    background:#fff;
    box-shadow:0 18px 40px rgba(15,23,42,.14);
    padding:12px;

    max-height:280px;              /* ✅ LIMIT HEIGHT */
    overflow-y:auto;               /* ✅ ENABLE SCROLL */
    overscroll-behavior:contain;   /* smoother mobile scroll */
}

.centre-options{
    max-height:180px;
    overflow-y:auto;
}

.centre-menu::-webkit-scrollbar{
    width:6px;
}
.centre-menu::-webkit-scrollbar-thumb{
    background:#CFE6D8;
    border-radius:10px;
}

.centre-dropdown.open .centre-menu{
    display:block;
}

.centre-search{
    width:100%;
    height:40px;
    margin-bottom:10px;
    border-radius:12px;
    border:1px solid #E2E8F0;
    padding:0 12px;
}

.centre-options{
    max-height:220px;
    overflow:auto;
    display:grid;
    gap:8px;
    padding-right:4px;
}

.centre-option{
    display:flex;
    flex-direction:row;
    align-items:center;
    gap:10px;
    padding:9px 10px;
    border:1px solid #E2E8F0;
    border-radius:12px;
    background:#F8FAFC;
    cursor:pointer;
    color:#334155;
    font-weight:600;
    transition:.18s ease;
}

.centre-option:hover{
    background:#E4F7EA;
    border-color:rgba(95,168,120,.35);
}

.centre-option input{
    width:18px;
    height:18px;
    min-width:18px;
    accent-color:#5FA878;
}

.centre-menu-footer{
    display:flex;
    justify-content:flex-end;
    gap:10px;
    margin-top:12px;
    padding-top:10px;
    border-top:1px solid #E2E8F0;
}

.centre-ok-btn,
.centre-clear-btn{
    border:none;
    border-radius:999px;
    padding:8px 16px;
    font-family:"Times New Roman", Georgia, serif;
    font-weight:700;
    cursor:pointer;
}

.centre-ok-btn{
    background:#5FA878;
    color:#fff;
}

.centre-clear-btn{
    background:#E4F7EA;
    color:#3B7D55;
}

.field-help{
    display:block;
    margin-top:6px;
    color:#64748B;
    font-size:.92rem;
    line-height:1.45;
    font-weight:400;
}

/* BUTTON */
.submit-btn{
    height:46px;
    border:none;
    border-radius:999px;
    background:#5FA878;
    color:#fff;
    font-weight:700;
    cursor:pointer;
    font-family:"Times New Roman", Georgia, serif;
    box-shadow:0 12px 26px rgba(95,168,120,.22);
}

.submit-btn:hover{
    background:#3B7D55;
}

/* MOBILE */
@media(max-width:900px){
    .form-grid{
        grid-template-columns:1fr;
    }

    .back-btn{
        display:flex;
        align-items:center;
        justify-content:center;
    }

    .title-row{
        align-items:stretch;
        flex-direction:column;
    }

    .page-actions,
    .page-actions a{
        width:100%;
        justify-content:center;
    }
}

@media(max-width:420px){
    .page-card{
        padding:18px;
        border-radius:18px;
    }

    .title-left h2{
        font-size:1.45rem;
    }
}

.centre-select-display,
.centre-select-display:hover,
.centre-select-display:focus,
.centre-select-display:active{
    background:#fff !important;
    color:#334155 !important;
    outline:none !important;
    border-color:#DCEEE2 !important;
    box-shadow:none !important;
    -webkit-tap-highlight-color:transparent;
}

.centre-select-display:focus-visible{
    border-color:#5FA878 !important;
    box-shadow:0 0 0 4px rgba(95,168,120,.12) !important;
}

.centre-dropdown{
    position:relative;
    width:100%;
}
</style>

<div class="page-card">

    <div class="title-row">
        <div class="title-left">
            <button type="button" class="back-btn" onclick="history.back()" aria-label="Back">←</button>
            <h2>Add Product</h2>
        </div>

        <div class="page-actions">
            <a href="{{ url_for('admin.product_list') }}">View Products</a>
            <a href="{{ url_for('admin.product_categories') }}">Categories</a>
        </div>
    </div>

    <form method="post" enctype="multipart/form-data" class="form-grid" id="addProductForm">

        <label>Name
            <input type="text" name="name" required>
        </label>

        <label>Category
            <select name="category" required>
                <option value="">Select Category</option>
                {% for c in categories %}
                    <option value="{{ c.name }}">{{ c.name }}</option>
                {% endfor %}
            </select>
        </label>

        <label>Type
            <select name="type" required>
                <option value="">Select Type</option>
                <option value="input">Input</option>
                <option value="output">Output</option>
            </select>
        </label>

        <label>Price
            <input type="text" name="price" required>
        </label>

        <div class="full">
            <label>Available Centres</label>

            <div class="centre-dropdown" id="centreDropdown">
                <button type="button" class="centre-select-display" id="centreToggle">
                    <span id="centreSelectedText">Select Centres</span>
                    <b class="centre-arrow">⌄</b>
                </button>

                <div class="centre-menu" id="centreMenu">
                    <input type="text" class="centre-search" id="centreSearch" placeholder="Search centres...">

                    <div class="centre-options" id="centreOptions">
                        <label class="centre-option">
                            <input type="checkbox" name="available_centres" value="all" class="centre-check" data-all>
                            <span>All Centres</span>
                        </label>

                        {% for centre in centres %}
                        <label class="centre-option">
                            <input type="checkbox" name="available_centres" value="{{ centre.centre_uid }}" class="centre-check">
                            <span>
                                {{ centre.centre_uid }}
                                {% if centre.name %} - {{ centre.name }}{% endif %}
                            </span>
                        </label>
                        {% endfor %}
                    </div>

                    <div class="centre-menu-footer">
                        <button type="button" class="centre-clear-btn" id="centreClearBtn">Clear</button>
                        <button type="button" class="centre-ok-btn" id="centreOkBtn">OK</button>
                    </div>
                </div>
            </div>

            <small class="field-help">
                Select one or multiple centres from the dropdown, then click OK.
            </small>
        </div>

        <label class="full">Product Image
            <input type="file" name="product_image" accept="image/*">
        </label>

        <div class="full">
            <button type="submit" class="submit-btn">Save Product</button>
        </div>

    </form>

</div>

<script>
(function(){
    const dropdown = document.getElementById('centreDropdown');
    const toggle = document.getElementById('centreToggle');
    const okBtn = document.getElementById('centreOkBtn');
    const clearBtn = document.getElementById('centreClearBtn');
    const search = document.getElementById('centreSearch');
    const selectedText = document.getElementById('centreSelectedText');
    const checks = Array.from(document.querySelectorAll('.centre-check'));
    const all = document.querySelector('[data-all]');
    const options = Array.from(document.querySelectorAll('.centre-option'));

    if(!dropdown || !toggle || !checks.length) return;

    function updateSelectedText(){
        const selected = checks
            .filter(c => c.checked)
            .map(c => c.closest('.centre-option').innerText.trim());

        if(selected.length === 0){
            selectedText.textContent = 'Select Centres';
        }else if(selected.includes('All Centres')){
            selectedText.textContent = 'All Centres';
        }else if(selected.length <= 2){
            selectedText.textContent = selected.join(', ');
        }else{
            selectedText.textContent = selected.length + ' centres selected';
        }

        checks[0].setCustomValidity(selected.length ? '' : 'Please select at least one centre.');
    }

    toggle.addEventListener('click', function(){
        dropdown.classList.toggle('open');
        if(dropdown.classList.contains('open') && search){
            setTimeout(() => search.focus(), 80);
        }
    });

    if(okBtn){
        okBtn.addEventListener('click', function(){
            dropdown.classList.remove('open');
            updateSelectedText();
        });
    }

    if(clearBtn){
        clearBtn.addEventListener('click', function(){
            checks.forEach(c => c.checked = false);
            updateSelectedText();
        });
    }

    checks.forEach(check => {
        check.addEventListener('change', function(){
            if(check === all && check.checked){
                checks.forEach(c => {
                    if(c !== all) c.checked = false;
                });
            }

            if(check !== all && check.checked && all){
                all.checked = false;
            }

            updateSelectedText();
        });
    });

    if(search){
        search.addEventListener('input', function(){
            const q = search.value.trim().toLowerCase();

            options.forEach(option => {
                option.style.display = option.innerText.toLowerCase().includes(q) ? 'flex' : 'none';
            });
        });
    }

    document.addEventListener('click', function(e){
        if(!dropdown.contains(e.target)){
            dropdown.classList.remove('open');
        }
    });

    document.getElementById('addProductForm').addEventListener('submit', function(){
        updateSelectedText();
    });

    updateSelectedText();
})();
</script>

{% endblock %}
